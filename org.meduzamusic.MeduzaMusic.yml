app-id: org.meduzamusic.MeduzaMusic
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: meduza-music
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
build-options:
  build-args:
    - --share=network
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/meduza-music/cargo
modules:
  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -O yt-dlp
      - install -D -m 755 yt-dlp /app/bin/yt-dlp
  - name: mpv
    buildsystem: simple
    build-commands:
      # Use an AppImage or static build of mpv for simplicity in this local flatpak
      - wget https://github.com/ivan-hc/MPV-appimage/releases/download/continuous/mpv-Media-Player_0.41.0-3-archimage5.0-x86_64.AppImage -O mpv
      - chmod +x mpv
      - install -D -m 755 mpv /app/bin/mpv
  - name: meduza-music
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -D -m 755 target/release/meduza-ui /app/bin/meduza-music
      - install -D -m 644 org.meduzamusic.MeduzaMusic.desktop /app/share/applications/org.meduzamusic.MeduzaMusic.desktop
      - install -D -m 644 logo.png /app/share/icons/hicolor/512x512/apps/org.meduzamusic.MeduzaMusic.png
    sources:
      - type: dir
        path: .
