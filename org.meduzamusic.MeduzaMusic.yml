app-id: org.meduzamusic.MeduzaMusic
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: meduza-music
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --socket=session-bus
  - --own-name=org.meduzamusic.MeduzaMusic
  - --talk-name=org.freedesktop.Notifications
build-options:
  build-args:
    - --share=network
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/meduza-music/cargo
modules:
  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -O yt-dlp
      - install -D -m 755 yt-dlp /app/bin/yt-dlp
  - name: mpv
    buildsystem: simple
    build-commands:
      # Extract the AppImage at BUILD time: FUSE is not available inside the
      # Flatpak sandbox, and AppRun sets up its own LD_LIBRARY_PATH after
      # PlaybackManager strips inherited library paths.
      - wget https://github.com/ivan-hc/MPV-appimage/releases/download/continuous/mpv-Media-Player_0.41.0-3-archimage5.0-x86_64.AppImage -O mpv.AppImage
      - chmod +x mpv.AppImage
      - ./mpv.AppImage --appimage-extract
      - install -d /app/lib/mpv
      - cp -a squashfs-root/. /app/lib/mpv/
      - printf '#!/bin/sh\nexec /app/lib/mpv/AppRun "$@"\n' > mpv-wrapper
      - install -D -m 755 mpv-wrapper /app/bin/mpv
  - name: meduza-music
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -D -m 755 target/release/meduza-ui /app/bin/meduza-music
      - install -D -m 644 org.meduzamusic.MeduzaMusic.desktop /app/share/applications/org.meduzamusic.MeduzaMusic.desktop
      - install -D -m 644 org.meduzamusic.MeduzaMusic.metainfo.xml /app/share/metainfo/org.meduzamusic.MeduzaMusic.metainfo.xml
      - install -D -m 644 logo.png /app/share/icons/hicolor/512x512/apps/org.meduzamusic.MeduzaMusic.png
    sources:
      - type: dir
        path: .
