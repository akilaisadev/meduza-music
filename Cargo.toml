[package]
name = "meduza-music"
version = "1.2.0"
edition = "2021"
license = "MIT"

[dependencies]
eframe = { version = "0.26", features = ["default"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "gzip", "blocking"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["tls"], default-features = false }
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "webp"] }
dirs = "5.0"
chrono = "0.4"
url = "2.5"
tray-icon = { version = "0.14", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
